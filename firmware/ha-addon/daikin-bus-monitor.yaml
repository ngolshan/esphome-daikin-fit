---
# ESPHome Daikin Fit: device config for the Home Assistant ESPHome add-on
# (ESPHome Device Builder). Copy this file to /config/esphome/ in Home
# Assistant, add the secrets below to /config/esphome/secrets.yaml, then use
# Install -> Wirelessly. Home Assistant then manages OTA updates for the device.
#
# Unlike firmware/waveshare-esp32-s3-rs485-can.yaml, which builds from a local
# checkout, this pulls the ClimateTalk component and the decode package from
# GitHub, so it is the only file you need on the add-on.
#
# Secrets this needs in /config/esphome/secrets.yaml:
#   wifi_ssid, wifi_password, fallback_wifi_password,
#   daikin_bus_monitor_api_key, daikin_bus_monitor_ota_password
# To take over a device that is already running, the API key and OTA password
# must be the same ones it was flashed with, and `name` must match.
#
# LISTEN ONLY BY DEFAULT: nothing is written to the bus until the "Bus Transmit"
# switch is turned on in Home Assistant. See docs/how-it-works.md.

substitutions:
  name: "daikin-bus-monitor"
  friendly_name: "Daikin Bus Monitor"
  bus_transmit_at_boot: ALWAYS_OFF

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  comment: "Daikin Fit CT-485 bus monitor"
  project:
    name: "ngolshan.esphome-daikin-fit"
    version: "1.0.0"
  on_boot:
    then:
      - lambda: App.set_loop_interval(0);

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

external_components:
  - source: github://ngolshan/esphome-daikin-fit
    components: [comfortnet]
    refresh: 1d

packages:
  daikin_fit: github://ngolshan/esphome-daikin-fit/firmware/daikin-fit.yaml@main

preferences:
  flash_write_interval: 24h

logger:
  # DEBUG keeps the per-frame dump that tools/ctlog.py and tools/ctcap.py read.
  level: DEBUG
  tx_buffer_size: 4096

api:
  encryption:
    key: !secret daikin_bus_monitor_api_key

ota:
  - platform: esphome
    # No password: a bare encryption block makes OTA uploads authenticate with
    # the api encryption key above, which the device already accepts. A password
    # would cost about 3.5 KB of flash for nothing. Needs ESPHome 2026.9 or newer
    # on both the builder and the uploader.
    encryption:

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Daikin Bus Monitor Fallback"
    password: !secret fallback_wifi_password

captive_portal:

time:
  - platform: homeassistant
    id: ha_time

uart:
  id: comfortnet_uart
  baud_rate: 9600
  data_bits: 8
  stop_bits: 1
  parity: NONE
  rx_buffer_size: 1500
  tx_pin: GPIO17
  rx_pin: GPIO18

comfortnet:
  id: comfortnet_id
  uart_id: comfortnet_uart
  # RS485 driver enable; leaving it unset lets the pin float and can jam the bus.
  flow_control_pin: GPIO21
  listen_only: true
  update_interval: 60s
  device_type: 0x1D  # gateway
  ct_version: 2
